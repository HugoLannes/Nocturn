name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Ensure workflow runs from main
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "This workflow must be run from the main branch. Current branch: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7
        with:
          toolchain: stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Compute next version and stamp manifests
        shell: bash
        run: |
          node <<'EOF'
          const fs = require('node:fs');
          const cp = require('node:child_process');

          // Series (major.minor) is controlled by package.json; the patch is
          // auto-incremented from the highest existing release tag so every push
          // to main yields a strictly-newer installable version.
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const [maj, min, basePatch] = pkg.version.split('.').map((n) => parseInt(n, 10));
          if ([maj, min, basePatch].some((n) => !Number.isInteger(n))) {
            console.error(`Cannot parse a semver x.y.z from package.json version "${pkg.version}".`);
            process.exit(1);
          }
          const series = `${maj}.${min}`;

          const patches = cp.execSync('git tag -l', { encoding: 'utf8' })
            .split('\n')
            .map((t) => t.trim().replace(/^v/, ''))
            .filter((t) => t.startsWith(`${series}.`))
            .map((t) => parseInt(t.split('.')[2], 10))
            .filter((n) => Number.isInteger(n));

          // First release of a new series starts at package.json's patch; otherwise
          // one past the highest tagged patch (never below the manifest value).
          const nextPatch = patches.length
            ? Math.max(Math.max(...patches) + 1, basePatch)
            : basePatch;
          const version = `${series}.${nextPatch}`;

          // Stamp all three manifests so the built app, its Cargo crate, and the
          // updater latest.json all carry the same version. Not committed back to
          // the repo (that would loop the workflow); this only affects the build.
          pkg.version = version;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');

          const tauriPath = 'src-tauri/tauri.conf.json';
          const tauri = JSON.parse(fs.readFileSync(tauriPath, 'utf8'));
          tauri.version = version;
          fs.writeFileSync(tauriPath, JSON.stringify(tauri, null, 2) + '\n');

          const cargoPath = 'src-tauri/Cargo.toml';
          const cargo = fs.readFileSync(cargoPath, 'utf8');
          const stampedCargo = cargo.replace(/^version\s*=\s*"[^"]+"/m, `version = "${version}"`);
          if (stampedCargo === cargo) {
            console.error('Could not stamp version into src-tauri/Cargo.toml.');
            process.exit(1);
          }
          fs.writeFileSync(cargoPath, stampedCargo);

          fs.appendFileSync(process.env.GITHUB_ENV, `APP_VERSION=${version}\n`);
          console.log(`Next release version: ${version}`);
          EOF

      - name: Ensure release tag does not already exist
        shell: bash
        run: |
          tag="v${APP_VERSION}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Release tag ${tag} already exists." >&2
            exit 1
          fi

      - name: Ensure updater signing secrets are configured
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY secret." >&2
            exit 1
          fi

      - name: Build and publish release
        uses: tauri-apps/tauri-action@73fb865345c54760d875b94642314f8c0c894afa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Nocturn v__VERSION__
          releaseBody: |
            Automated build from the latest push to `main`.
            See the assets attached to this release to install or auto-update Nocturn.
          releaseDraft: true
          prerelease: false

      - name: Publish release once assets are verified
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v${APP_VERSION}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name')"

          if ! echo "$assets" | grep -qx "latest.json"; then
            echo "latest.json is missing from release ${tag}; leaving the release as a draft." >&2
            exit 1
          fi

          gh release edit "$tag" --draft=false
